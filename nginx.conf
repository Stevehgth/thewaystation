# nginx-unprivileged listens on 8080 as a non-root user. Traefik terminates TLS.
server_tokens off;

map $uri $cache_control {
    default            "no-cache";
    ~\.(js|css|svg)$   "public, max-age=3600";
}

# www -> apex
server {
    listen 8080;
    server_name www.thewaystation.co.za;
    location = /health { default_type text/plain; access_log off; return 200 "ok\n"; }
    location / { return 301 https://thewaystation.co.za$request_uri; }
}

server {
    listen 8080 default_server;
    server_name thewaystation.co.za _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $cache_control always;

    location = /health { default_type text/plain; access_log off; return 200 "ok\n"; }
    location / { try_files $uri $uri/ =404; }
}
